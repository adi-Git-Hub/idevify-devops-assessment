name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/adi-git-hub/devops-fullstack-backend:latest
            ghcr.io/adi-git-hub/devops-fullstack-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=""
          push: true
          tags: |
            ghcr.io/adi-git-hub/devops-fullstack-frontend:latest
            ghcr.io/adi-git-hub/devops-fullstack-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2 via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via native SSH & SCP
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

          # Ensure app directory exists on EC2
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "mkdir -p /home/ubuntu/app"

          # Securely transfer production compose file
          scp -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no docker-compose.prod.yml ubuntu@$EC2_HOST:/home/ubuntu/app/docker-compose.yml

          # Execute deployment and verification remotely
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "bash -s" "$GITHUB_ACTOR" "$GITHUB_TOKEN" << 'EOF'
            set -e
            ACTOR="$1"
            TOKEN="$2"

            cd /home/ubuntu/app

            # Ensure .env exists with production safe defaults
            if [ ! -f .env ]; then
              cat << 'ENVFILE' > .env
          DEBUG=False
          SECRET_KEY=prod-secret-key-$(openssl rand -hex 16)
          ALLOWED_HOSTS=*
          CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
          CORS_ALLOW_ALL_ORIGINS=True
          ENVFILE
            fi

            # Log in to GHCR to pull package images
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            # Pull latest images and restart containers
            docker compose pull
            docker compose up -d --remove-orphans

            # Healthcheck verification
            echo "Waiting for services to become healthy..."
            sleep 8
            curl -sf http://localhost/api/hello/
            echo "CI/CD deployment verified successfully!"
          EOF

          # Clean up private key from runner
          rm -f ~/.ssh/deploy_key.pem
