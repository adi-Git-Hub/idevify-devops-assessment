services:
  backend:
    image: ghcr.io/adi-git-hub/devops-fullstack-backend:latest
    container_name: fullstack-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    image: ghcr.io/adi-git-hub/devops-fullstack-frontend:latest
    container_name: fullstack-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
