name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/adi-git-hub/devops-fullstack-backend:latest
            ghcr.io/adi-git-hub/devops-fullstack-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=""
          push: true
          tags: |
            ghcr.io/adi-git-hub/devops-fullstack-frontend:latest
            ghcr.io/adi-git-hub/devops-fullstack-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2 via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/app"

      - name: Deploy and Verify Containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/app
            mv -f docker-compose.prod.yml docker-compose.yml

            # Ensure .env exists with production safe defaults
            if [ ! -f .env ]; then
              cat << 'EOF' > .env
            DEBUG=False
            SECRET_KEY=prod-secret-key-$(openssl rand -hex 16)
            ALLOWED_HOSTS=*
            CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://${{ secrets.EC2_HOST }}
            CORS_ALLOW_ALL_ORIGINS=True
            EOF
            fi

            # Log in to GHCR to pull package images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull and restart services
            docker compose pull
            docker compose up -d --remove-orphans

            # Healthcheck verification
            echo "Waiting for services to become healthy..."
            sleep 8
            curl -sf http://localhost/api/hello/
            echo "CI/CD deployment verified successfully!"
